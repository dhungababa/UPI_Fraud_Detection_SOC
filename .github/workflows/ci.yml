name: UPI Fraud SOC - CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run PyTest & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Test Suite
        run: |
          pytest tests/ -v --junitxml=reports/pytest-report.xml

      - name: Verify API Import & Health
        run: |
          python -c "from api.main import app; print('FastAPI App successfully initialized')"
